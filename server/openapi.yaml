openapi: 3.1.0
info:
  title: Freelanso API
  version: 1.0.0
  description: Health, identity, profiles, projects, services, jobs, and applications.
servers:
  - url: http://localhost:5000
    description: Local development
paths:
  /healthz:
    get:
      summary: Check process liveness
      security: []
      responses:
        "200":
          description: The API process is live.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LivenessResponse"
  /readyz:
    get:
      summary: Check Firestore readiness
      security: []
      responses:
        "200":
          description: Firestore is reachable.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReadinessResponse"
        "503":
          description: Firestore is unavailable.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /api/me:
    get:
      summary: Get the authenticated user's public identity
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Verified Firebase identity.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MeResponse"
        "401":
          description: Missing, invalid, expired, or revoked Firebase token.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "503":
          description: Firebase Authentication verification is unavailable.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /api/dashboard:
    get:
      summary: Get the authenticated user's dashboard data
      security:
        - bearerAuth: []
      parameters:
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 50
            default: 20
        - name: projectCursor
          in: query
          description: Pass __done__ to omit project records when only continuing service pages.
          schema:
            type: string
            maxLength: 2048
        - name: serviceCursor
          in: query
          description: Pass __done__ to omit service records when only continuing project pages.
          schema:
            type: string
            maxLength: 2048
      responses:
        "200":
          description: Caller-owned listings, aggregate counts and real profile satisfaction data.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DashboardResponse"
        "400":
          description: Invalid page limit or cursor.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Authentication is required.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /api/users/me:
    get:
      summary: Get the authenticated user's private profile
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Private profile, including email and private contact fields.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PrivateUserResponse"
        "401":
          description: Missing, invalid, expired, or revoked Firebase token.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /api/users/{uid}:
    parameters:
      - in: path
        name: uid
        required: true
        schema:
          type: string
          maxLength: 128
    get:
      summary: Get a public profile
      security: []
      responses:
        "200":
          description: Public profile without email, phone, or private address.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PublicUserResponse"
        "404":
          description: Profile not found.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    put:
      summary: Update a profile (owner or admin only)
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProfileUpdate"
      responses:
        "200":
          description: Updated private profile.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PrivateUserResponse"
        "400":
          description: Invalid or unknown profile fields.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Authentication is required.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Caller is neither owner nor admin.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /api/users/onboarding:
    post:
      summary: Set an account's freelancer/client role once
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [role]
              properties:
                role:
                  type: string
                  enum: [freelancer, client]
      responses:
        "201":
          description: The account's initial role.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RoleResponse"
        "400":
          description: Invalid role or request fields.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Authentication is required.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: A different role has already been assigned.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /api/uploads/sign:
    post:
      summary: Sign a restricted profile, project, or battle-media upload
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                purpose:
                  type: string
                  enum: [profile, project, battle]
                  default: profile
                resourceType:
                  type: string
                  enum: [image, video]
      responses:
        "200":
          description: Cloudinary upload parameters for the authenticated user's folder.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UploadSignatureResponse"
        "401":
          description: Authentication is required.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "503":
          description: Cloudinary signing is not configured.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /api/projects:
    get:
      summary: List published projects
      security: []
      parameters:
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Cursor"
        - name: category
          in: query
          schema:
            type: string
            enum:
              [
                logo-design,
                ui-ux-design,
                web-development,
                video-editing,
                illustration,
                content-writing,
                seo-marketing,
                motion-graphics,
              ]
        - name: q
          in: query
          description: Case-insensitive token search. Matching query tokens are ORed, then candidates are ranked in memory.
          schema:
            type: string
            maxLength: 80
        - name: skills
          in: query
          description: Comma-separated skill names; up to 10 values. Combined with q, skills are applied after candidate retrieval.
          schema:
            type: string
            maxLength: 409
        - name: sort
          in: query
          description: popular orders by likesCount descending, viewsCount descending, createdAt descending, and ID descending.
          schema:
            type: string
            enum: [newest, oldest, price_asc, price_desc, popular]
            default: newest
        - name: minPrice
          in: query
          schema:
            type: number
            minimum: 0
            maximum: 100000000
        - name: maxPrice
          in: query
          schema:
            type: number
            minimum: 0
            maximum: 100000000
      responses:
        "200":
          description: Cursor-paginated projects and owner summaries. Meta includes limit, nextCursor, appliedFilters, and total when aggregation is available.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProjectPageResponse"
        "400":
          description: Invalid filters or cursor.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    post:
      summary: Publish a project (freelancer or admin)
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProjectWrite"
      responses:
        "201":
          description: Created project.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProjectResponse"
        "400":
          description: Invalid project fields or media URL.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Authentication is required.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Only freelancers and admins can publish projects.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /api/projects/mine:
    get:
      summary: List the authenticated user's projects, including drafts
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Cursor"
      responses:
        "200":
          description: Cursor-paginated projects owned by the caller.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProjectPageResponse"
        "401":
          description: Authentication is required.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /api/projects/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          maxLength: 128
    get:
      summary: Get a published project or an owner's draft
      security:
        - bearerAuth: []
        - {}
      responses:
        "200":
          description: Project DTO with public owner summary.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProjectResponse"
        "404":
          description: Project does not exist or is not visible to the caller.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    put:
      summary: Update an owned project (owner or admin)
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProjectUpdate"
      responses:
        "200":
          description: Updated project DTO.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProjectResponse"
        "400":
          description: Invalid or protected project fields.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Authentication is required.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Caller does not own the project.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    delete:
      summary: Delete an owned project and its subcollections
      security:
        - bearerAuth: []
      responses:
        "204":
          description: Project and nested Firestore documents were deleted.
        "401":
          description: Authentication is required.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Caller does not own the project.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Project not found.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /api/projects/{id}/like:
    post:
      summary: Toggle the caller's project like
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/ProjectId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
      responses:
        "200":
          description: Updated like state and count.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LikeResponse"
        "401":
          description: Authentication is required.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Project not found.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /api/projects/{id}/comments:
    get:
      summary: List public project comments
      security: []
      parameters:
        - $ref: "#/components/parameters/ProjectId"
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Cursor"
      responses:
        "200":
          description: Cursor-paginated comments with public author summaries.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CommentPageResponse"
        "404":
          description: Published project not found.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    post:
      summary: Add a plain-text project comment
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/ProjectId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [text]
              properties:
                text:
                  type: string
                  minLength: 1
                  maxLength: 1000
      responses:
        "201":
          description: Created comment DTO.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CommentResponse"
        "400":
          description: Invalid comment.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Authentication is required.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Published project not found.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /api/projects/{id}/comments/{commentId}:
    delete:
      summary: Delete a comment as its author, project owner, or admin
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/ProjectId"
        - name: commentId
          in: path
          required: true
          schema:
            type: string
            maxLength: 128
      responses:
        "204":
          description: Comment deleted.
        "401":
          description: Authentication is required.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Caller cannot moderate this comment.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Project or comment not found.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /api/jobs:
    get:
      summary: Search and list open jobs
      security: []
      parameters:
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Cursor"
        - name: q
          in: query
          schema:
            type: string
            maxLength: 80
        - name: category
          in: query
          schema:
            type: string
            pattern: "^[a-z0-9]+(?:-[a-z0-9]+)*$"
        - name: skills
          in: query
          description: Comma-separated skills; up to 10 values.
          schema:
            type: string
            maxLength: 409
        - name: minPrice
          in: query
          description: Minimum requested budget; matches jobs whose budgetMax reaches this value.
          schema:
            type: number
            minimum: 0
        - name: maxPrice
          in: query
          description: Maximum requested budget; matches jobs whose budgetMin is at or below this value.
          schema:
            type: number
            minimum: 0
        - name: jobType
          in: query
          schema:
            type: string
            enum: [freelance, part-time, full-time, contract, internship]
        - name: location
          in: query
          schema:
            type: string
            maxLength: 120
        - name: sort
          in: query
          description: popular sorts by application count, then creation time and ID descending.
          schema:
            type: string
            enum: [newest, oldest, price_asc, price_desc, popular]
            default: newest
      responses:
        "200":
          description: Cursor-paginated open jobs with public owner summaries.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JobPageResponse"
        "400":
          description: Invalid search, filter, sort, or cursor.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    post:
      summary: Create a job (client or admin)
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/JobWrite"
      responses:
        "201":
          description: Created open job.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JobResponse"
        "400":
          description: Invalid or protected job fields.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Authentication is required.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Only clients and admins can post jobs.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /api/jobs/{id}:
    parameters:
      - $ref: "#/components/parameters/ProjectId"
    get:
      summary: Get a job
      security: []
      responses:
        "200":
          description: Job DTO with a public owner summary.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JobResponse"
        "404":
          description: Job not found or deleted.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    put:
      summary: Update a job as its owner or an admin
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/JobUpdate"
      responses:
        "200":
          description: Updated job DTO.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JobResponse"
        "400":
          description: Invalid or protected job fields.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Authentication is required.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Caller does not own the job.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Job not found.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    delete:
      summary: Soft-delete a job as its owner or an admin
      security:
        - bearerAuth: []
      responses:
        "204":
          description: Job marked deleted; application history remains.
        "401":
          description: Authentication is required.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Caller does not own the job.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Job not found.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /api/jobs/{id}/applications:
    parameters:
      - $ref: "#/components/parameters/ProjectId"
    get:
      summary: List a job's applications as its owner
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Cursor"
      responses:
        "200":
          description: Cursor-paginated applications with public applicant summaries.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApplicationPageResponse"
        "401":
          description: Authentication is required.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Caller is not the job owner.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Job not found.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    post:
      summary: Apply to an open job as a freelancer
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ApplicationWrite"
      responses:
        "201":
          description: Created application.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApplicationResponse"
        "400":
          description: Invalid application fields.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Authentication is required.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Only freelancers can apply; applicants cannot apply to their own job.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: Job is closed or the applicant already applied.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /api/applications/me:
    get:
      summary: List the authenticated user's applications
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Cursor"
      responses:
        "200":
          description: Cursor-paginated applications submitted by the caller.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApplicationPageResponse"
        "401":
          description: Authentication is required.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /api/applications/{id}/status:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          maxLength: 300
    patch:
      summary: Update application status using the allowed state transitions
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ApplicationStatusUpdate"
      responses:
        "200":
          description: Updated application.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApplicationResponse"
        "400":
          description: Invalid status.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Authentication is required.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Caller is neither the applicant nor the job owner.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Application not found.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: Requested state transition is not allowed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /api/meta/categories:
    get:
      summary: List canonical service categories
      security: []
      responses:
        "200":
          description: Canonical service category slugs and display labels.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ServiceCategoryResponse"
  /api/services:
    get:
      summary: List published services
      security: []
      parameters:
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Cursor"
        - name: q
          in: query
          description: Case-insensitive token search ranked within each cursor page.
          schema:
            type: string
            maxLength: 80
        - name: skills
          in: query
          description: Comma-separated skill names; up to 10 values.
          schema:
            type: string
            maxLength: 409
        - name: category
          in: query
          schema:
            type: string
            enum:
              [
                design-creative,
                video-animation,
                writing-translation,
                digital-marketing,
                tech-development,
                ai-automation,
                business-legal,
              ]
        - name: minPrice
          in: query
          schema:
            type: number
            minimum: 0
            maximum: 100000000
        - name: maxPrice
          in: query
          schema:
            type: number
            minimum: 0
            maximum: 100000000
        - name: sort
          in: query
          description: popular orders by ratingAvg descending, ratingCount descending, createdAt descending, and ID descending.
          schema:
            type: string
            enum: [newest, oldest, price_asc, price_desc, popular]
            default: newest
      responses:
        "200":
          description: Cursor-paginated services. Popular uses rating average, rating count, createdAt descending, then ID descending. Meta includes applied filters and total when available.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ServicePageResponse"
        "400":

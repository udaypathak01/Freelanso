            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /api/battles:
    get:
      summary: List cursor-paginated skill battles
      security: []
      parameters:
        - name: filter
          in: query
          schema:
            type: string
            enum: [all, live, ended]
            default: all
        - name: category
          in: query
          schema:
            type: string
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 50
        - name: cursor
          in: query
          schema:
            type: string
            maxLength: 2048
      responses:
        "200":
          description: Battle DTOs with cursor metadata.
    post:
      summary: Create a battle with two to six options
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [title, category, options, endsAt]
              properties:
                title:
                  type: string
                  minLength: 4
                  maxLength: 120
                description:
                  type: string
                  maxLength: 2000
                category:
                  type: string
                endsAt:
                  type: string
                  format: date-time
                options:
                  type: array
                  minItems: 2
                  maxItems: 6
                  items:
                    type: object
                    additionalProperties: false
                    required: [title, description, imageUrl]
                    properties:
                      title:
                        type: string
                        minLength: 1
                        maxLength: 100
                      description:
                        type: string
                        minLength: 1
                        maxLength: 1200
                      imageUrl:
                        type: string
                        format: uri
                      author:
                        type: string
                        maxLength: 80
      responses:
        "201":
          description: Created battle DTO.
        "400":
          description: Invalid input or non-Cloudinary image URL.
        "401":
          description: Authentication is required.
  /api/battles/{id}:
    get:
      summary: Get a battle, including the caller's vote when authenticated
      security:
        - {}
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Battle DTO.
        "404":
          description: Battle not found.
  /api/battles/{id}/user-vote:
    get:
      summary: Get the authenticated user's vote for a battle
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Whether and which option the caller voted for.
        "401":
          description: Authentication is required.
        "404":
          description: Battle not found.
  /api/battles/{id}/vote:
    post:
      summary: Vote once for an option in an open battle
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [optionId]
              properties:
                optionId:
                  type: string
                  pattern: "^[A-Z]$"
      responses:
        "200":
          description: Updated battle DTO.
        "400":
          description: Invalid option ID.
        "401":
          description: Authentication is required.
        "409":
          description: Battle is closed or the caller has already voted.
  /api/search/smart:
    post:
      summary: Search published projects with optional Gemini ranking
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [query]
              properties:
                query:
                  type: string
                  minLength: 1
                  maxLength: 500
                filters:
                  type: object
                  additionalProperties: false
                  properties:
                    category:
                      type: string
                    skills:
                      type: array
                      minItems: 1
                      maxItems: 10
                      items:
                        type: string
                    minPrice:
                      type: number
                      minimum: 0
                    maxPrice:
                      type: number
                      minimum: 0
                    sort:
                      type: string
                      enum: [newest, oldest, price_asc, price_desc, popular]
      responses:
        "200":
          description: Hydrated project results from the bounded candidate set; meta.degraded indicates fallback.
        "400":
          description: Invalid query or filters.
        "401":
          description: Authentication is required.
        "429":
          description: Per-user daily quota or AI rate limit exceeded.
  /api/matches/score-all:
    post:
      summary: Score freelancer profiles for a caller-owned project
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [projectId]
              properties:
                projectId:
                  type: string
      responses:
        "200":
          description: Deterministically ranked safe freelancer DTOs and score breakdowns.
        "401":
          description: Authentication is required.
        "403":
          description: Caller does not own the project and is not an admin.
        "404":
          description: Project not found.
        "429":
          description: AI rate limit exceeded.
  /api/support/tickets:
    post:
      summary: Submit an optional-auth support ticket
      security:
        - {}
        - bearerAuth: []
      parameters:
        - name: Idempotency-Key
          in: header
          required: false
          schema:
            type: string
            maxLength: 200
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [name, email, subject, message]
              properties:
                name:
                  type: string
                  maxLength: 100
                email:
                  type: string
                  format: email
                  maxLength: 254
                subject:
                  type: string
                  minLength: 3
                  maxLength: 120
                message:
                  type: string
                  minLength: 10
                  maxLength: 5000
                companyWebsite:
                  type: string
                  maxLength: 500
      responses:
        "201":
          description: Ticket accepted or existing idempotent ticket returned.
        "400":
          description: Invalid ticket or populated honeypot.
        "429":
          description: Support rate limit exceeded.
    get:
      summary: List support tickets (admin only)
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Cursor-paginated support tickets.
        "401":
          description: Authentication is required.
        "403":
          description: Administrator role is required.
  /api/support/tickets/me:
    get:
      summary: List the caller's support tickets
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Cursor-paginated private ticket records.
        "401":
          description: Authentication is required.
  /api/support/tickets/{id}/status:
    patch:
      summary: Transition a support ticket (admin only)
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [status]
              properties:
                status:
                  type: string
                  enum: [open, in_progress, resolved]
      responses:
        "200":
          description: Updated ticket DTO.
        "403":
          description: Administrator role is required.
        "409":
          description: Invalid ticket status transition.
  /api/conversations:
    get:
      summary: List the caller's conversations and unread counts
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Conversations ordered by latest activity with participant summaries.
        "401":
          description: Authentication is required.
    post:
      summary: Create or retrieve a conversation with one recipient
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              anyOf:
                - required: [recipientId]
                - required: [recipientUid]
              properties:
                recipientId:
                  type: string
                  maxLength: 128
                recipientUid:
                  type: string
                  maxLength: 128
                postId:
                  type: string
                  maxLength: 128
      responses:
        "201":
          description: Canonical conversation with participants as a UID array.
        "400":
          description: Invalid request or self-conversation.
        "401":
          description: Authentication is required.
        "404":
          description: Recipient profile not found.
  /api/conversations/unread-count:
    get:
      summary: Get the caller's total unread message count
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Unread count for the authenticated user.
        "401":
          description: Authentication is required.
  /api/conversations/{id}/messages:
    get:
      summary: Get a paginated conversation message history
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
        - name: before
          in: query
          schema:
            type: string
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 50
            default: 30
      responses:
        "200":
          description: Messages ordered oldest-first within the returned page; metadata contains the older-page cursor.
        "401":
          description: Authentication is required.
        "403":
          description: Caller is not a conversation participant.
        "404":
          description: Conversation not found.
    post:
      summary: Send an authenticated conversation message
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [text, tempId]
              properties:
                text:
                  type: string
                  minLength: 1
                  maxLength: 2000
                tempId:
                  type: string
                  maxLength: 128
      responses:
        "201":
          description: Stored message with idempotent client tempId.
        "400":
          description: Message text is invalid.
        "401":
          description: Authentication is required.
        "403":
          description: Caller is not a conversation participant.
        "404":
          description: Conversation not found.
        "429":
          description: More than 20 messages were sent in 10 seconds.
  /api/conversations/{id}/read:
    post:
      summary: Mark incoming messages in a conversation as read
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
      responses:
        "200":
          description: Read receipts were updated.
        "401":
          description: Authentication is required.
        "403":
          description: Caller is not a conversation participant.
        "404":
          description: Conversation not found.
  /api/wallet:
    get:
      summary: Get the caller's internal wallet balance
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Available and pending balances in integer minor currency units.
        "401":
          description: Authentication is required.
  /api/withdrawals:
    post:
      summary: Reserve available wallet funds for internal withdrawal processing
      description: This request does not trigger a Stripe Connect transfer or payout.
      security:
        - bearerAuth: []
      parameters:
        - name: Idempotency-Key
          in: header
          required: true
          schema:
            type: string
            minLength: 1
            maxLength: 200
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [amount]
              properties:
                amount:
                  type: integer
                  description: Integer minor currency units (paise for INR).
                  minimum: 10000
                  maximum: 1000000
      responses:
        "201":
          description: Pending withdrawal and ledger entry created.
        "400":
          description: Invalid amount or missing idempotency key.
        "401":
          description: Authentication is required.
        "409":
          description: Insufficient funds or idempotency key conflict.
  /api/withdrawals/me:
    get:
      summary: List the caller's withdrawals
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Cursor-paginated withdrawal DTOs.
        "401":
          description: Authentication is required.
  /api/withdrawals/{id}/status:
    patch:
      summary: Approve or reject a withdrawal (admin only)
      description: Rejection restores reserved funds; approval does not initiate a payout.
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [status]
              properties:
                status:
                  type: string
                  enum: [approved, rejected]
      responses:
        "200":
          description: Updated withdrawal DTO.
        "403":
          description: Administrator role is required.
        "409":
          description: Withdrawal was already processed.
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: Firebase ID token
  parameters:
    Limit:
      name: limit
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 50
        default: 20
    Cursor:
      name: cursor
      in: query
      schema:
        type: string
        maxLength: 2048
    ProjectId:
      name: id
      in: path
      required: true
      schema:
        type: string
        maxLength: 128
  schemas:
    SuccessEnvelope:
      type: object
      required: [success, data, meta]
      properties:
        success:
          const: true
        data:
          type: object
        meta:
          type: object
    LivenessResponse:
      allOf:
        - $ref: "#/components/schemas/SuccessEnvelope"
        - type: object
          properties:
            data:
              type: object
              required: [status]
              properties:
                status:
                  const: ok
    ReadinessResponse:
      allOf:
        - $ref: "#/components/schemas/SuccessEnvelope"
        - type: object
          properties:
            data:
              type: object
              required: [status]
              properties:
                status:
                  const: ready
    MeResponse:
      allOf:
        - $ref: "#/components/schemas/SuccessEnvelope"
        - type: object
          properties:
            data:
              type: object
              required: [uid, email, role, emailVerified]
              properties:
                uid:
                  type: string
                email:
                  type: [string, "null"]
                  format: email
                role:
                  type: [string, "null"]
                  enum: [freelancer, client, admin, null]
                emailVerified:
                  type: boolean
    DashboardResponse:
      allOf:
        - $ref: "#/components/schemas/SuccessEnvelope"
        - type: object
          properties:
            data:
              type: object
              required:
                [
                  projects,
                  services,
                  pagination,
                  counts,
                  engagement,
                  applications,
                  earnings,
                  satisfaction,
                ]
              properties:
                projects:
                  type: array
                  items:
                    $ref: "#/components/schemas/Project"
                services:
                  type: array
                  items:
                    $ref: "#/components/schemas/Service"
                pagination:
                  type: object
                  required: [limit, projectsNextCursor, servicesNextCursor]
                  properties:
                    limit:
                      type: integer
                    projectsNextCursor:
                      type: [string, "null"]
                    servicesNextCursor:
                      type: [string, "null"]
                counts:
                  type: object
                  properties:
                    projects:
                      $ref: "#/components/schemas/ListingStatusCounts"
                    services:
                      $ref: "#/components/schemas/ListingStatusCounts"
                    listings:
                      type: integer
                engagement:
                  type: object
                  required: [likes, comments, views]
                  properties:
                    likes:
                      type: integer
                    comments:
                      type: integer
                    views:
                      type: integer
                applications:
                  type: object
                  description: Zero until application storage is implemented.
                  required: [sent, received]
                  properties:
                    sent:
                      type: integer
                    received:
                      type: integer
                earnings:
                  type: object
                  description: Zero with null currency until a ledger is implemented.
                  required: [total, currency]
                  properties:
                    total:
                      type: number
                    currency:
                      type: [string, "null"]
                satisfaction:
                  type: object
                  required: [ratingAvg, ratingCount]
                  properties:
                    ratingAvg:
                      type: [number, "null"]
                    ratingCount:
                      type: integer
    ListingStatusCounts:
      type: object
      required: [total, byStatus]
      properties:
        total:
          type: integer
        byStatus:
          type: object
          additionalProperties:
            type: integer
    PublicUserResponse:
      allOf:
        - $ref: "#/components/schemas/SuccessEnvelope"
        - type: object
          properties:
            data:
              $ref: "#/components/schemas/PublicUser"
    PrivateUserResponse:
      allOf:
        - $ref: "#/components/schemas/SuccessEnvelope"
        - type: object
          properties:
            data:
              allOf:
                - $ref: "#/components/schemas/PublicUser"
                - type: object
                  required: [email, phone, privateAddress]
                  properties:
                    email:
                      type: [string, "null"]
                    phone:
                      type: string
                    privateAddress:
                      type: object
    PublicUser:
      type: object
      required: [id, displayName, role, headline, bio, skills, location, stats]
      properties:
        id:
          type: string
        displayName:
          type: string
        photoURL:
          type: [string, "null"]
        role:
          type: [string, "null"]
          enum: [freelancer, client, admin, null]
        headline:
          type: string
        bio:
          type: string
        handle:
          type: string
        bannerURL:
          type: [string, "null"]
        skills:
          type: array
          maxItems: 30
          items:
            type: string
        hourlyRate:
          type: [number, "null"]
        location:
          type: object
          properties:
            country:
              type: string
            state:
              type: string
            city:
              type: string
        languages:
          type: array
          items:
            type: object
        socialLinks:
          type: object
        stats:
          type: object
          properties:
            projectsCount:
              type: integer
            ratingAvg:
              type: number
            ratingCount:
              type: integer
        experience:
          type: array
          items:
            type: object
        education:
          type: array
          items:
            type: object
        certifications:
          type: array
          items:
            type: object
        createdAt:
          type: [string, "null"]
          format: date-time
        updatedAt:
          type: [string, "null"]
          format: date-time
    ProfileUpdate:
      type: object
      additionalProperties: false
      properties:
        displayName:
          type: string
          minLength: 1
          maxLength: 80
        headline:
          type: string
          maxLength: 120
        bio:
          type: string
          maxLength: 2000
        handle:
          type: string
          maxLength: 40
        photoURL:
          type: string
          format: uri
        bannerURL:
          type: string
          format: uri
        phone:
          type: string
          maxLength: 30
        location:
          type: object
          additionalProperties: false
          properties:
            country:
              type: string
              maxLength: 80
            state:
              type: string
              maxLength: 80
            city:
              type: string
              maxLength: 80
        privateAddress:
          type: object
          additionalProperties: false
          properties:
            line1:
              type: string
              maxLength: 160
            line2:
              type: string
              maxLength: 160
            postalCode:
              type: string
              maxLength: 24
        skills:
          type: array
          maxItems: 30
          items:
            type: string
            minLength: 1
            maxLength: 40
        hourlyRate:
          type: [number, "null"]
          minimum: 0
          maximum: 1000000
        languages:
          type: array
          maxItems: 20
          items:
            type: object
            additionalProperties: false
            required: [lang, proficiency]
            properties:
              lang:
                type: string
                maxLength: 40
              proficiency:
                type: string
                maxLength: 40
        socialLinks:
          type: object
          additionalProperties: false
          properties:
            website:
              type: string
              format: uri
            linkedin:
              type: string
              format: uri
            github:
              type: string
              format: uri
            twitter:
              type: string
              format: uri
            dribbble:
              type: string
              format: uri
            behance:
              type: string
              format: uri
        experience:
          type: array
          maxItems: 20
          items:
            type: object
        education:
          type: array
          maxItems: 20
          items:
            type: object
        certifications:
          type: array
          maxItems: 30
          items:
            type: object
    RoleResponse:
      allOf:
        - $ref: "#/components/schemas/SuccessEnvelope"
        - type: object
          properties:
            data:
              type: object
              required: [role]
              properties:
                role:
                  type: string
                  enum: [freelancer, client]
    UploadSignatureResponse:
      allOf:
        - $ref: "#/components/schemas/SuccessEnvelope"
        - type: object
          properties:
            data:
              type: object
              required:
                [
                  cloudName,
                  apiKey,
                  timestamp,
                  assetFolder,
                  uploadPreset,
                  signature,
                ]
              properties:
                cloudName:
                  type: string
                apiKey:
                  type: string
                timestamp:
                  type: integer
                assetFolder:
                  type: string
                uploadPreset:
                  type: string
                resourceType:
                  type: string
                  enum: [image, video]
                allowedFormats:
                  type: string
                maxFileSize:
                  type: integer
                signature:
                  type: string
    ProjectWrite:
      type: object
      additionalProperties: false
      required:
        [

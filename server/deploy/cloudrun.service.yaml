apiVersion: serving.knative.dev/v1
kind: Service
metadata:
  name: freelanso-api
  annotations:
    run.googleapis.com/launch-stage: GA
spec:
  template:
    metadata:
      annotations:
        autoscaling.knative.dev/minScale: "1"
        run.googleapis.com/execution-environment: gen2
    spec:
      containerConcurrency: 40
      timeoutSeconds: 60
      serviceAccountName: freelanso-api@PROJECT_ID.iam.gserviceaccount.com
      containers:
        - image: REGION-docker.pkg.dev/PROJECT_ID/freelanso/api:TAG
          ports:
            - name: http1
              containerPort: 8080
          resources:
            limits:
              cpu: "1"
              memory: 512Mi
          startupProbe:
            httpGet:
              path: /readyz
              port: 8080
            timeoutSeconds: 3
            periodSeconds: 5
            failureThreshold: 12
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8080
            timeoutSeconds: 3
            periodSeconds: 10
            failureThreshold: 3
          env:
            - name: NODE_ENV
              value: production
            - name: PORT
              value: "8080"
            - name: FIREBASE_PROJECT_ID
              value: PROJECT_ID
            - name: CORS_ALLOWED_ORIGINS
              valueFrom:
                secretKeyRef:
                  key: latest
                  name: freelanso-cors-origins
            - name: LOG_LEVEL
              value: info
            - name: TRUST_PROXY
              value: "1"
            - name: REQUEST_TIMEOUT_MS
              value: "55000"
            - name: CLOUDINARY_CLOUD_NAME
              valueFrom:
                secretKeyRef:
                  key: latest
                  name: freelanso-cloudinary-cloud-name
            - name: CLOUDINARY_API_KEY
              valueFrom:
                secretKeyRef:
                  key: latest
                  name: freelanso-cloudinary-api-key
            - name: CLOUDINARY_API_SECRET
              valueFrom:
                secretKeyRef:
                  key: latest
                  name: freelanso-cloudinary-api-secret
            - name: CLOUDINARY_PROFILE_UPLOAD_PRESET
              valueFrom:
                secretKeyRef:
                  key: latest
                  name: freelanso-cloudinary-profile-preset
            - name: CLOUDINARY_PROJECT_UPLOAD_PRESET
              valueFrom:
                secretKeyRef:
                  key: latest
                  name: freelanso-cloudinary-project-preset
